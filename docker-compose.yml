services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cab_o_meter
      POSTGRES_USER: cabwala
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - cabometer-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabwala -d cab_o_meter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cabometer-pg:
