spring:
  application:
    name: cab-o-meter
  datasource:
    url: ${CAB_DB_URL:jdbc:postgresql://localhost:5432/cab_o_meter}
    username: ${CAB_DB_USER:cabwala}
    password: ${CAB_DB_PASSWORD:secret}
  flyway:
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

cab:
  cors:
    origins: ${CAB_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.sangeeth.cab: INFO
    org.springframework.jdbc.core: WARN
